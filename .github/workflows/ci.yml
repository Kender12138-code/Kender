name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint（只查 eval/）
        # src/ 里还有一批历史风格问题（未排序 import、blind except 等），
        # 清理它们会改到业务代码，等专门做一次重构再纳入；
        # eval/ 是这一轮新写的，要求全绿。
        run: |
          pip install ruff
          ruff check eval

      - name: 环境信息
        # 出问题时第一手资料：Python / pytest / 关键依赖版本
        run: |
          python -V
          python -m pytest --version
          python -c "import sys; print('cwd ok, sys.path[0]=', sys.path[0])"
          pip list | grep -Ei "agentscope|faiss|gradio|ddgs|pytest|ruff" || true

      - name: 单元测试
        # 全部离线：搜索/嵌入/模型调用都被 mock 或替换，
        # 不需要 DASHSCOPE_API_KEY，CI 里也不该有。
        #
        # 失败时把关键行写成 ::error:: 注解 —— 即使没有管理员权限下载日志，
        # 也能通过 check-run annotations API 读到真正的报错。
        # ⚠️ GitHub 每个步骤只保留前 10 条注解，所以先发最重要的：
        # 1) 最后一行（异常类型 + 消息） 2) pytest 的 FAILED/ERROR 汇总行
        run: |
          set +e
          pytest -q --maxfail=1 > pytest.log 2>&1
          code=$?
          cat pytest.log
          if [ $code -ne 0 ]; then
            last=$(tail -n 1 pytest.log)
            echo "::error::${last}"
            grep -E "^(E   |FAILED|ERROR)" pytest.log | tail -n 8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $code
          fi

  eval-smoke:
    # 评测要真实 API Key，只在手动触发时跑（fork 的 PR 拿不到 secret）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 跑全量评测
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python eval/run_all.py --quiet
